name: CI

on:
  push:
    branches: [main, arena/**, feature/**]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agencyos
          POSTGRES_PASSWORD: agencyos_dev_password
          POSTGRES_DB: agencyos
        options: >-
          --health-cmd "pg_isready -U agencyos -d agencyos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: node_modules/.bin/prisma generate --debug 2>&1 | tee prisma-debug.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: prisma-debug-log
          path: prisma-debug.log
      - run: npm run lint
      - run: npx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agencyos
          POSTGRES_PASSWORD: agencyos_dev_password
          POSTGRES_DB: agencyos
        options: >-
          --health-cmd "pg_isready -U agencyos -d agencyos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: node_modules/.bin/prisma generate --debug 2>&1 | tee prisma-debug.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: prisma-debug-log
          path: prisma-debug.log
      - run: node_modules/.bin/prisma migrate deploy 2>&1 | tee prisma-migrate.log
        env:
          DATABASE_URL: "postgresql://agencyos:agencyos_dev_password@localhost:5432/agencyos?schema=public"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: prisma-migrate-log
          path: prisma-migrate.log
      - run: npm test 2>&1 | tee test-output.log
        env:
          DATABASE_URL: "postgresql://agencyos:agencyos_dev_password@localhost:5432/agencyos?schema=public"
          BETTER_AUTH_SECRET: "test-secret-do-not-use-in-production"
          BETTER_AUTH_URL: "http://localhost:3000"
          NODE_ENV: "test"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-output-log
          path: test-output.log

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: node_modules/.bin/prisma generate --debug 2>&1 | tee prisma-debug.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: prisma-debug-log
          path: prisma-debug.log
      - run: npm run build 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
