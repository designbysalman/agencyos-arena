name: CI

on:
  push:
    branches: [main, arena/**, feature/**]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --legacy-peer-deps
      # Prisma Client type augmentation is provided by types/prisma-client.d.ts
      # for environments where prisma generate cannot download binaries.
      - run: npm run lint
      - run: npx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agencyos
          POSTGRES_PASSWORD: agencyos_dev_password
          POSTGRES_DB: agencyos
        options: >-
          --health-cmd "pg_isready -U agencyos -d agencyos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --legacy-peer-deps
      # Generate Prisma Client for real database access in integration tests.
      # If binary download fails, unit tests still run (they mock the DB layer).
      - run: npx prisma generate || true
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: "postgresql://agencyos:agencyos_dev_password@localhost:5432/agencyos?schema=public"
        if: success()
      - run: npm test
        env:
          DATABASE_URL: "postgresql://agencyos:agencyos_dev_password@localhost:5432/agencyos?schema=public"
          BETTER_AUTH_SECRET: "test-secret-do-not-use-in-production"
          BETTER_AUTH_URL: "http://localhost:3000"
          NODE_ENV: "test"

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate || true
      - run: npm run build
