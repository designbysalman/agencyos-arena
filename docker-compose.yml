# AgencyOS — Phase 0 Local Development
# No cloud resources are provisioned. All services run locally.
#
# To start:   docker compose up
# To stop:    docker compose down
# To reset DB: docker compose down -v && docker compose up

services:
  postgres:
    image: postgres:16-alpine
    container_name: agencyos-postgres
    environment:
      POSTGRES_USER: agencyos
      POSTGRES_PASSWORD: agencyos_dev_password
      POSTGRES_DB: agencyos
    ports:
      - "5432:5432"
    volumes:
      - agencyos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agencyos -d agencyos"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: agencyos-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://agencyos:agencyos_dev_password@postgres:5432/agencyos?schema=public"
      NEXTAUTH_SECRET: "replace-with-a-strong-secret-in-production"
      BETTER_AUTH_SECRET: "replace-with-a-strong-secret-in-production"
      BETTER_AUTH_URL: "http://localhost:3000"
      NODE_ENV: "development"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev

volumes:
  agencyos_postgres_data:
